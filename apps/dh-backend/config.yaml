# DeepHarness Backend 运行时配置
# 优先级：环境变量 > config.yaml > 代码默认值

server:
  port: "8080"

session:
  store_type: "memory"
  message_store_type: "memory"
  # buffer_store_type: SSE 事件和 run checkpoint 的存储后端。
  #   memory: 内存存储（默认，不跨重启）
  #   redis:  Redis 存储（支持单节点和 Cluster，跨重启恢复）
  buffer_store_type: "memory"
  timeout: "30m"
  max_messages: 1000

# Redis 配置（buffer_store_type 为 redis 时生效）
# addrs 配置多个地址时自动使用 Cluster 模式，单个地址使用单节点模式。
# 环境变量 REDIS_ADDRS 可用逗号分隔多个地址。
redis:
  addrs:
    - "127.0.0.1:6379"
  password: ""
  db: 0
  prefix: "dh"

gatewayd:
  admin_url: "http://127.0.0.1:2346"
  agent_id: "opencode"

database:
  host: "127.0.0.1"
  port: "5433"
  user: "deepharness"
  password: "deepharness"
  name: "deepharness"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"

workspace:
  root: "/home/nan/test"

# personal-stub 服务地址（部署在 WORKSPACE_ROOT 所在服务器上）
# dh-backend 将文件/工程/预览相关请求代理到此地址
personal_stub:
  url: "http://127.0.0.1:8090"

# crawler-service 服务地址，用于 /prd-research 等网站爬取场景。
# 架构上 crawler-service 独立部署于单独服务器，dh-backend 通过 HTTP 直连调用。
crawler_service:
  url: "http://127.0.0.1:8091"
  # 超时需 > crawler-service 的 REQUEST_TIMEOUT_MS(100s)，确保 crawler-service BFS 总体超时(90s)
  # 能先触发并返回部分结果，而非 dh-backend 端先超时导致整体失败。
  timeout: "105s"
  # max_depth: /prd-research 抓取的站内链接深度（层数），起始页为第 1 层，默认 2。
  max_depth: 2

# 产品空间文档采纳配置
# doc_adoption_cleanup: 文档采纳到产品空间后，自动清理个人工作区中的源草稿文件。
#   enabled: 是否启用自动清理。
#   retention_days: 源文件保留天数，超过后删除。
#   interval: 清理任务执行间隔。
product_space:
  doc_adoption_cleanup:
    enabled: true
    retention_days: 14
    interval: "24h"

# 平台支持的 coding agent 与模型池配置
# 该列表决定超管在空间管理时可选择哪些 agent 与模型。
coding_agents:
  agents:
    - key: opencode
      name: OpenCode
      description: 开源编码智能体，支持多种编程语言和框架
    - key: claude-code
      name: Claude Code
      description: Anthropic 推出的编码助手，擅长复杂逻辑推理
    - key: codex
      name: Codex
      description: OpenAI Codex，专为软件工程优化的 AI 模型
  # 模型池按厂商分组配置，前端模型下拉框按此分组展示。
  # key 为厂商标识，name 为下拉分组显示名，models 为该厂商下的模型清单。
  model_vendors:
    - key: kimi
      name: Kimi（月之暗面）
      models:
        - kimi-latest
        - kimi-k2
        - kimi-k1.5
    - key: glm
      name: GLM（智谱）
      models:
        - glm-4-plus
        - glm-4-0520
        - glm-4-air
        - glm-4-airx
        - glm-4-flash
        - glm-4-long
        - glm-4v-plus
    - key: minimax
      name: MiniMax
      models:
        - minimax-text-01
        - minimax-pro
    - key: qwen
      name: 通义千问
      models:
        - qwen-max
        - qwen-plus
        - qwen-turbo
        - qwen-coder-plus
        - qwen3-235b-a22b
    - key: deepseek
      name: DeepSeek
      models:
        - deepseek-chat
        - deepseek-coder
        - deepseek-reasoner
    - key: ernie
      name: 文心一言
      models:
        - "ernie-4.0"
        - "ernie-4.5"
        - "ernie-x1"
    - key: hunyuan
      name: 腾讯混元
      models:
        - hunyuan-pro
        - hunyuan-standard

# Agent 运行时状态上报配置
# bearer_token 是外部 gatewayd / personal-stub 调用状态上报接口时必须携带的 Bearer Token。
# 生产环境请通过环境变量 AGENT_RUNTIME_BEARER_TOKEN 注入强随机字符串。
agent_runtime:
  bearer_token: "96be41dbe1875010dafbe237c7082df1379a503c33412cd5f19d256a5c566c92"

# 飞书机器人接入配置
# webhook_token: 调用本平台 webhook 接口时必须携带的 Bearer Token（本平台侧鉴权，区别于飞书侧的 verify_token）。
# mock_mode: true 时跳过飞书签名校验并将回复输出到日志，便于本地用 curl 验证 @机器人 -> agent -> 回复 全链路。
#   生产环境必须设为 false 并填入真实 app_id/app_secret/verify_token。
# bot_user_id: 飞书用户未绑定平台账号时兜底使用的平台用户 ID（决定 agent 工作目录归属）。
# default_workspace: 兜底工作空间 ID（未绑定用户在该空间下操作）。
# dispatch_timeout: agent 单次分发超时，覆盖长任务（原型生成等）。
feishu:
  app_id: ""
  app_secret: ""
  verify_token: ""
  encrypt_key: ""
  webhook_token: "feishu-local-dev-token"
  api_base_url: "https://open.feishu.cn/open-apis"
  bot_user_id: ""
  default_workspace: ""
  mock_mode: true
  dispatch_timeout: "30m"
  # admin_user_ids: 白名单用户 open_id 列表，拥有完整编码能力（编码/原型/需求/总结）
  # 环境变量 FEISHU_ADMIN_USER_IDS 用逗号分隔多个 open_id
  admin_user_ids: ["ou_test_user_001"]

workitem:
  platforms:
    - meego
    - jira
  sync:
    interval: "5m"
    workers: 4
    timeout: "30s"
  writeback:
    enabled: true
    workers: 2
    retry: 3

# 安全配置
# ssh_key_encryption_key: 用于加密存储在 repositories.ssh_key 列的 SSH 私钥。
#   格式为 32 字节 AES-256 密钥的 hex 编码（64 个 hex 字符）。
#   为空时 SSH 私钥以明文存储（仅限开发环境）。
#   生成方法：openssl rand -hex 32
#   生产环境请通过环境变量 SSH_KEY_ENCRYPTION_KEY 注入。
security:
  ssh_key_encryption_key: ""

# Agent 实例供给器配置。
#   type: 供给器类型
#     - direct-host：本地开发，使用固定主机列表模拟容器分配
#     - k8s：Kubernetes 原生管理（Pod 生命周期）
#     - self-defined：通过 HTTP API 对接自定义外部供给器
# 公共字段适用于所有类型；类型专属配置在对应子块中填写。
agent_provisioner:
  type: "direct-host"

  # --- 公共配置 ---
  warm_pool_min: 2
  warm_pool_max: 10
  idle_timeout: "15m"
  sleep_evict_timeout: "30m"
  max_active_per_user: 3

  # --- direct-host 模式配置 ---
  direct_host:
    hosts:                      # 固定 IP 列表，每个 host 可承载多个用户实例
      - "127.0.0.1"
    agent_port: 2345            # gatewayd agent API 基础端口
    admin_port: 2346            # gatewayd admin API 基础端口
    stub_port: 8090             # personal-stub 基础端口（与 gatewayd 共部署）
    port_step: 10               # 每个槽位的端口递增步长（槽位 i: base + i * port_step）
    max_users_per_host: 5       # 每台主机最大用户数（槽位数）
    # gatewayd 二进制路径，传递给 personal-stub 由其启动和管理 gatewayd 进程。
    # 留空则回退到外部启动模式（如 start-dev.sh 手动启动）。
    gatewayd_bin: ""            # gatewayd 二进制路径，如 /path/to/dh-gatewayd
    stub_bin: ""                # personal-stub 二进制路径，如 /path/to/personal-stub
    bearer_token: "96be41dbe1875010dafbe237c7082df1379a503c33412cd5f19d256a5c566c92"
    dh_backend_url: "http://localhost:8080"
    # gatewayd 管理模式：single（1:1，每用户独占 personal-stub + gatewayd）或 multi（1:N，每主机一个 personal-stub 管理多个 gatewayd）。
    gatewayd_mode: "single"

  # --- k8s 模式配置（Kubernetes 原生管理）---
  k8s:
    namespace: "dh-agents"
    image: "deepharness/gatewayd:latest"
    stub_image: "deepharness/personal-stub:latest"  # personal-stub sidecar 镜像
    agent_port: 2345
    admin_port: 2346
    stub_port: 8090
    shared_pvc_name: "dh-workspace"
    workspace_mount_path: "/workspace"
    kubeconfig_path: ""         # 空则用 in-cluster config，非空时加载指定 kubeconfig 文件
    supports_bind: false
    resource_active:            # 活跃状态资源配额
      cpu_request: "2000m"
      cpu_limit: "4000m"
      memory_request: "4Gi"
      memory_limit: "8Gi"
    resource_sleeping:          # 休眠状态资源配额
      cpu_request: "100m"
      cpu_limit: "200m"
      memory_request: "128Mi"
      memory_limit: "256Mi"

  # --- self-defined 模式配置（HTTP API 对接自定义供给器）---
  self_defined:
    endpoint: ""                # 外部供给器 API 基地址，如 "http://my-provisioner:9000"
    token: ""                   # Bearer Token 认证
    timeout: "30s"              # HTTP 调用超时
    stub_port: 8090             # personal-stub 端口（ContainerInfo 需要）

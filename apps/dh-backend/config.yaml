# DeepHarness Backend 运行时配置
# 优先级：环境变量 > config.yaml > 代码默认值

server:
  port: "8080"

session:
  store_type: "memory"
  message_store_type: "memory"
  # buffer_store_type: SSE 事件和 run checkpoint 的存储后端。
  #   memory: 内存存储（默认，不跨重启）
  #   redis:  Redis 存储（支持单节点和 Cluster，跨重启恢复）
  buffer_store_type: "memory"
  timeout: "30m"
  max_messages: 1000

# Redis 配置（buffer_store_type 为 redis 时生效）
# addrs 配置多个地址时自动使用 Cluster 模式，单个地址使用单节点模式。
# 环境变量 REDIS_ADDRS 可用逗号分隔多个地址。
redis:
  addrs:
    - "127.0.0.1:6379"
  password: ""
  db: 0
  prefix: "dh"

gatewayd:
  admin_url: "http://127.0.0.1:2346"
  agent_id: "claude-code"

database:
  host: "127.0.0.1"
  port: "5433"
  user: "deepharness"
  password: "deepharness"
  name: "deepharness"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"

workspace:
  root: "/home/nan/test"

# agent-stub 服务地址（部署在 WORKSPACE_ROOT 所在服务器上）
# dh-backend 将文件/工程/预览相关请求代理到此地址
agent_stub:
  url: "http://127.0.0.1:8090"

# 平台支持的 coding agent 与模型池配置
# 该列表决定超管在空间管理时可选择哪些 agent 与模型。
coding_agents:
  agents:
    - key: opencode
      name: OpenCode
      description: 开源编码智能体，支持多种编程语言和框架
    - key: claude-code
      name: Claude Code
      description: Anthropic 推出的编码助手，擅长复杂逻辑推理
    - key: codex
      name: Codex
      description: OpenAI Codex，专为软件工程优化的 AI 模型
  models:
    # Kimi（月之暗面）
    - kimi-latest
    - kimi-k2
    - kimi-k1.5
    # GLM（智谱清言）
    - glm-4-plus
    - glm-4-0520
    - glm-4-air
    - glm-4-airx
    - glm-4-flash
    - glm-4-long
    - glm-4v-plus
    # MiniMax
    - minimax-text-01
    - minimax-pro
    # 通义千问
    - qwen-max
    - qwen-plus
    - qwen-turbo
    - qwen-coder-plus
    - qwen3-235b-a22b
    # DeepSeek
    - deepseek-chat
    - deepseek-coder
    - deepseek-reasoner
    # 文心一言
    - "ernie-4.0"
    - "ernie-4.5"
    - "ernie-x1"
    # 腾讯混元
    - hunyuan-pro
    - hunyuan-standard

workitem:
  platforms:
    - meego
    - jira
  sync:
    interval: "5m"
    workers: 4
    timeout: "30s"
  writeback:
    enabled: true
    workers: 2
    retry: 3

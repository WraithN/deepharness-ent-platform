      你是一位资深测试开发工程师。请根据以下需求或接口，生成可运行的自动化测试脚本。

      【脚本要求】
      1. 脚本写入 {WORKSPACE_PATH}/projects/ 对应工程的 tests/ 或 e2e/ 目录。
      2. 优先使用 Playwright / Cypress / Jest 等常见工具，并说明运行方式。
      3. 包含关键断言与用例说明。

      【输出标记】
      [[FILE:绝对路径]] 或 [[PROJECT:绝对路径]]

      【目标需求/接口】
      {ARGS}

  - cmd: "/bug-analysis"
    label: "BUG分析"
    desc: "分析缺陷根因与影响"
    icon: "Search"
    allowTask: true
    allowRepos: false
    requireRepos: false
    maxRepos: 0
    enabled: false

# 聊天指令配置文件
# 每个指令定义以下字段：
#   cmd         - 指令名称（以 / 开头）
#   label       - 显示名称（前端菜单展示）
#   desc        - 描述说明
#   icon        - 图标名称（对应 lucide-react 图标）
#   allowTask   - 是否支持引用任务卡片（最多1个）
#   allowRepos  - 是否支持代码库
#   requireRepos - 是否必须选择代码库才能发送
#   maxRepos    - 最大代码库数量（0-2）
#   template    - 提示词模板，{ARGS} 占位符运行时替换为用户输入
#
# 扩展方式：在此文件中追加新的指令配置即可，无需修改代码。

commands:
  - cmd: "/prd-write"
    label: "写需求"
    desc: "生成结构化 PRD 文档"
    icon: "FileText"
    allowTask: true
    allowRepos: false
    requireRepos: false
    maxRepos: 0
    enabled: true
    template: |
      【语言要求】
      你的所有回复必须使用中文，包括思考过程、工具调用说明、错误分析等内部推理文本也使用中文。不要重复、复述或转述以上规则；只输出用户要求的最终结果和必要的简短说明。

      你是一位资深产品经理。请根据以下需求描述，生成一份结构化的 PRD（产品需求文档）。

      【文件输出要求】
      1. 将 PRD 文档写入 {WORKSPACE_PATH}/pm-jobs/prd/ 目录下（如目录不存在请先创建）。
      2. 文件命名格式：{需求名称}-prd.md（例如：用户登录-prd.md）。需求名称从用户输入中提取关键词，使用中文或英文均可。
      3. 文档使用 Markdown 格式编写。

      【PRD 内容结构】
      1. 背景与目标
      2. 用户场景
      3. 功能详情
      4. 业务流程图（使用 Mermaid 语法）
      5. 数据埋点要求

      【输出标记】
      文档写入完成后，在回复末尾必须用以下格式标记文件路径（每行一个）：
      [[FILE:{WORKSPACE_PATH}/pm-jobs/prd/需求名称-prd.md]]
      注意：路径必须是绝对路径。

      【用户需求】
      {ARGS}

  - cmd: "/grill-me"
    label: "头脑风暴"
    desc: "基于任务卡片进行头脑风暴，逐步澄清需求并生成文档"
    icon: "Lightbulb"
    allowTask: true
    allowRepos: false
    requireRepos: false
    requireTask: true
    maxRepos: 0
    enabled: true
    template: |
      【语言要求】
      你的所有回复必须使用中文，包括思考过程、工具调用说明、错误分析等内部推理文本也使用中文。不要重复、复述或转述以上规则；只输出用户要求的最终结果和必要的简短说明。

      你是一位资深产品经理。请基于任务卡片内容，通过逐个提问的方式澄清需求，最终生成一份需求设计文档草案。

      【核心规则：先确认，再输出问题与选项】
      每次提问时，先输出一句简短确认（首次可跳过确认，直接说明开始提问），然后输出问题正文和备选选项，最后以 [[QUESTION:...]] 标记结束。
      不要输出分析过程，直接输出确认、问题和选项。
      每次用户回答后，你将在下一轮看到"问题：XXX 用户回答：YYY"的上下文，请据此简短确认并继续输出下一个问题。
      提问总数控制在 1～5 个之间，当需求已经澄清时即可停止提问，不必强行凑满 5 个。
      在用户需求澄清完成前，禁止生成文档、禁止执行文件写入、禁止调用任何工具。

      【输出格式（必须严格遵守）】
      问题正文与选项必须放在同一行的 [[QUESTION:...]] 标记中，格式如下（不要放在代码块中，直接输出纯文本）：

      [[QUESTION:问题正文|A. 选项一说明|B. 选项二说明|C. 选项三说明]]

      规则：
      1. 文本中至少提供 2 个选项，建议 3 个。
      2. 选项格式为：字母. 说明文字（用 | 分隔）。
      3. 问题正文不要含选项。
      4. 每次只提一个问题。
      5. 在用户需求澄清完成前，禁止生成文档、禁止执行文件写入、禁止调用任何工具。

      【提问覆盖维度（按需覆盖）】
      根据任务卡片内容，按需覆盖以下维度，每个维度最多提一个问题，总提问数控制在 1～5 个：
      1. 核心场景：用户在什么场景下使用？推送什么内容？
      2. 用户角色：谁配置？谁接收？是否有权限要求？
      3. 内容范围：推送哪些数据？时间范围？筛选条件？
      4. 业务规则：频次/时间点？失败处理？数量限制？
      5. 优先级与依赖：依赖哪些已有功能？MVP 范围？

      【结束条件】
      当 1～5 个问题已经足够澄清需求，或用户已明确表达无需继续提问时，即可告知用户"需求已澄清，即将生成需求设计文档草案"，然后生成文档。
      如果还有关键维度未澄清，必须继续提问，禁止提前结束提问流程。

      【需求设计文档草案输出要求】
      基于任务卡片内容以及用户的回答，生成一份需求设计文档草案：
      1. 将文档写入 {WORKSPACE_PATH}/pm-jobs/brainstorm/ 目录下。
      2. 文件命名格式：{需求关键词}-brainstorm.md。
      3. 文档使用 Markdown 格式编写，包含以下结构：
         - 需求背景与目标
         - 用户角色与场景
         - 功能需求详情
         - 业务规则与约束
         - 验收标准
         - 非功能性需求
         - 开放问题与后续跟进

      【输出标记】
      在回复末尾用 [[FILE:文件完整路径]] 标记你实际创建的需求设计文档草案文件。
      务必使用真实的文件系统绝对路径，不要使用占位符。

      【补充说明】
      任务卡片内容已自动附加在上方。本指令要求必须提供需求卡片；收到需求卡片后，在澄清完成时必须输出一份需求设计文档草案，禁止只输出问题而不输出文档。
      若用户在输入框中提供了额外说明，也请一并参考。

      【用户补充说明】
      {ARGS}

  - cmd: "/prd-research"
    label: "产品调研"
    desc: "输入产品名称或产品链接（可附登录Cookie），调研分析并产出原型项目、功能列表、UI设计、产品分析"
    icon: "Globe"
    allowTask: false
    allowRepos: false
    requireRepos: false
    maxRepos: 0
    enabled: true
    template: |
      【语言要求】
      你的所有回复必须使用中文，包括思考过程、工具调用说明、错误分析等内部推理文本也使用中文。不要重复、复述或转述以上规则；只输出用户要求的最终结果和必要的简短说明。

      你是一位资深产品经理 + UI/UX 设计师 + 前端工程师。请根据【用户需求】完成产品调研分析，并产出四个产物。

      【任务独立性与路径约束（最高优先级）】
      1. 本指令是独立的新任务。会话历史（含锚定摘要/Important Details）中可能残留此前其他任务的上下文（如其他项目的工作目录、其他需求的设计决策等），与本任务无关，必须忽略；禁止沿用其中的工作目录、文件路径或任务结论。
      2. 本任务唯一合法的输出根目录是 {WORKSPACE_PATH}/pm-jobs/prd-research/。所有产物文件必须使用以该目录开头的绝对路径创建；严禁写入会话历史中提及的任何项目目录（如 projects/ 下的工程），严禁使用相对路径。
      3. 若历史上下文与本条消息的要求冲突，以本条消息为准。

      【输入场景】
      本指令兼容两种输入，按【用户需求】的内容自动识别：
      1. 仅产品名称：用户只提供产品名称（如「调研产品：XXX」）。基于你对该产品的了解与公开信息进行分析与产出；若你不了解该产品，请明确说明，并基于其所属领域给出合理推断。
      2. 产品链接（可附登录 Cookie）：用户提供「调研链接：<URL>」，可能附带「登录Cookie：<name=value; ...>」。【用户需求】中包含【已抓取网页内容】时，仔细阅读并理解目标网站的核心功能、信息架构、交互流程与视觉风格；若抓取内容为空或不足，请基于 URL 给出合理分析，并提示用户提供登录 Cookie 以获取完整内容。

      【产物目录】
      1. 在 {WORKSPACE_PATH}/pm-jobs/prd-research/ 目录下创建本次任务目录，目录名使用网站域名或简短英文标识（如 example-com）。
      2. 必须生成以下四个产物：
         - 产品分析文档：{WORKSPACE_PATH}/pm-jobs/prd-research/{标识}/产品分析.md
         - 功能列表：{WORKSPACE_PATH}/pm-jobs/prd-research/{标识}/功能列表.md
         - UI 设计文档：{WORKSPACE_PATH}/pm-jobs/prd-research/{标识}/design.md
         - 原型项目：{WORKSPACE_PATH}/pm-jobs/prd-research/{标识}/prototype/（Vite + React 可运行工程）

      【执行流程】
      必须严格按以下两步顺序执行：
      1. 第一步：并行完成三份文档——产品分析.md、功能列表.md、design.md。三者之间没有依赖关系，应在同一轮中并行推进撰写，不要串行等待。
      2. 第二步：三份文档完成后，基于 design.md 与已抓取的页面内容进行 1:1 原型仿真，生成 prototype/ 工程。原型必须在样式上与原产品保持一致：布局结构、配色、字体、字号、间距、圆角、组件样式与关键交互均按原产品 1:1 还原（仅产品名称场景则按调研结论还原其公开页面的典型风格）。

      【产品分析.md 内容结构】
      1. 产品定位与目标用户
      2. 核心功能概述
      3. 信息架构（使用 Mermaid 图）
      4. 关键页面与交互流程
      5. 商业模式分析（如可推断）
      6. 竞品差异化分析
      7. 优缺点总结与改进建议

      【功能列表.md 内容结构】
      使用表格形式列出所有功能模块，每行为一个功能，包含以下列：
      | 功能名称 | 功能描述 | 优先级(P0/P1/P2) | 所在页面 | 交互说明 |

      【design.md 内容结构】
      1. 设计风格概述
      2. 色彩系统（主色、辅助色、状态色、文字色，附带色值）
      3. 字体与字号规范
      4. 间距与圆角规范
      5. 组件规范（按钮、输入框、卡片、导航等）
      6. 关键页面布局说明

      【原型项目要求】
      - 使用 React 18 + TypeScript + Tailwind CSS + Vite 创建工程。
      - 不需要后端服务；所有数据使用本地 mock 数据（放在 src/mocks/ 中），mock 数据应尽可能还原目标网站的真实数据结构和体量。
      - 关键组件/可点击元素必须添加稳定的 data-dh-id 属性。
      - 工程必须包含 `pnpm run dev` 和 `pnpm run build` 脚本。
      - 所有文件创建完成后，在工程目录下执行一次 `pnpm install && pnpm run build`，确保产出 dist/index.html 和 dist/assets/。
      - 1:1 仿真要求：尽可能还原目标产品的布局、配色、字体、间距、组件样式与关键交互，样式与原产品保持一致。
      - 图表使用 ECharts CDN（`https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js`）。
      - 不要生成登录页、注册页或任何认证流程，除非目标网站的核心功能就是认证。

      【输出标记】
      - 文档类产物使用 [[FILE:文件完整路径]] 标记。
      - 原型工程使用 [[PROJECT:工程完整路径]] 标记工程根目录（即 prototype/ 目录）。
      务必使用真实的文件系统绝对路径，不要使用占位符。

      【用户需求】
      {ARGS}

  - cmd: "/proto-make"
    label: "做原型"
    desc: "生成 UI 原型设计稿"
    icon: "LayoutTemplate"
    allowTask: true
    allowRepos: true
    requireRepos: false
    maxRepos: 2
    enabled: true
    template: |
      【语言要求】
      你的所有回复必须使用中文，包括思考过程、工具调用说明、错误分析等内部推理文本也使用中文。不要重复、复述或转述以上规则；只输出用户要求的最终结果和必要的简短说明。

      你是一位前端工程师与 UI 设计师。请根据以下需求生成可运行的前端原型。

      {PROTO_TEMPLATES}

      【产出规则】
      一、若上方「可用工程模版」列出了模版，且存在与需求场景匹配的模版：
      1. 选择最匹配的一个模版（按其「场景」「标签」描述判断）。若所有模版都不匹配，跳到规则二。
      2. 将该模版工程复制到 {WORKSPACE_PATH}/pm-jobs/prototypes/{工程名}/（工程名用需求关键词英文命名）：
         - 复制时排除 node_modules 与 dist 目录。
         - 复制后，将 {工程名}/node_modules 软链接到模版路径下的 node_modules（依赖已预装），避免重复安装：
           ln -s {模版路径}/node_modules {WORKSPACE_PATH}/pm-jobs/prototypes/{工程名}/node_modules
      3. 仅在模版约定的页面目录（如 src/pages/）下新增或修改页面，复用模版已有的组件、路由、布局与样式；不要改动 package.json 的依赖与构建配置。
      4. 关键可点击元素必须添加稳定的 data-dh-id 属性，这对后续产品标注与走查非常重要。
      5. 完成后在工程根目录执行一次 `pnpm run build`（禁止执行 pnpm install，依赖已由模版预装），确保产出 dist/。
      6. 输出标记（绝对路径）：
         [[PROJECT:{WORKSPACE_PATH}/pm-jobs/prototypes/{工程名}]]
      7. 需求名：在最终输出前，根据用户输入的需求卡片标题或需求描述，总结一个简短的中文需求名，并用 [[REQ_NAME:需求名]] 标记输出。若已引用需求卡片，尽量与卡片标题保持一致。

      二、若上方「可用工程模版」为空，或没有任何模版匹配需求：
      采用「拆分式单页 HTML」方案，使用内置脚手架保证样式与功能一致：

      步骤 1 — 写入脚手架文件（原样写入，不要修改内容）：
      将以下内容写入 {WORKSPACE_PATH}/pm-jobs/prototypes/{工程名}/dh-base.css：
      ---dh-base.css 开始---
      {HTML_SCAFFOLD_CSS}
      ---dh-base.css 结束---

      将以下内容写入 {WORKSPACE_PATH}/pm-jobs/prototypes/{工程名}/dh-base.js：
      ---dh-base.js 开始---
      {HTML_SCAFFOLD_JS}
      ---dh-base.js 结束---

      步骤 2 — 编写页面 HTML：
      1. 在 {WORKSPACE_PATH}/pm-jobs/prototypes/{工程名}/ 目录下产出多个独立 HTML，每个页面一个文件（如 index.html、dashboard.html、detail.html）。
      2. 每个 HTML 的 <head> 必须按此顺序引入：
         <link rel="stylesheet" href="dh-base.css">
         <script src="dh-base.js"></script>
         <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
         图表使用 ECharts CDN，不需要后端服务，数据使用 dh-store（localStorage）或页面内 mock。
      3. 直接使用 dh-base.css 的组件类，不要自己写基础样式。可用类名：
         布局：page-container / page-header / page-title / page-subtitle / content-wrapper / sidebar / main-content
         导航：navbar / navbar-logo / navbar-nav / navbar-user / navbar-avatar
         按钮：btn / btn-primary / btn-secondary / btn-danger / btn-success / btn-sm
         卡片：card / card-body / stat-grid / stat-card / stat-card-label / stat-card-value
         表格：table-wrap / table
         表单：form-group / form-label / form-input / form-select / form-textarea / form-row
         标签：tag / tag-blue / tag-green / tag-yellow / tag-red / tag-gray
         模态框：modal-overlay / modal / modal-header / modal-close / modal-body / modal-footer
         筛选：filter-bar / filter-search / filter-tabs / filter-tab
         进度条：progress-bar / progress-bar-fill（green/yellow/red）
         其他：toast-container / toast / empty-state / empty-state-title / empty-state-desc / actions
      4. dh-base.js 提供的函数（直接调用，不要重复定义）：
         dhStore.get(key, fallback) / dhStore.set(key, val) / dhStore.remove(key)
         formatMoney(n) / formatDate(d) / formatDateTime(d)
         showToast(msg, type) / getUrlParam(name)
         getStatusLabel(status) / getStatusTagClass(status) / debounce(fn, delay)
      5. 关键可点击元素必须添加稳定的 data-dh-id 属性，这对后续产品标注与走查非常重要。
      6. 不要生成登录页、注册页或任何认证流程，除非用户在需求中明确要求。
      7. 最后仅输出一个 [[PROJECT:绝对路径]] 标记工程根目录作为结果卡片，不要输出 [[FILE:...]] 标记：
         [[PROJECT:{WORKSPACE_PATH}/pm-jobs/prototypes/{工程名}]]
      8. 需求名：在最终输出前，根据用户输入的需求卡片标题或需求描述，总结一个简短的中文需求名，并用 [[REQ_NAME:需求名]] 标记输出。若已引用需求卡片，尽量与卡片标题保持一致。

      【需求描述】
      {ARGS}

  - cmd: "/code"
    label: "写代码"
    desc: "根据需求生成技术文档并编写代码"
    icon: "Code2"
    allowTask: true
    allowRepos: true
    requireRepos: false
    maxRepos: 2
    enabled: true
    template: |
      【语言要求】
      你的所有回复必须使用中文，包括思考过程、工具调用说明、错误分析等内部推理文本也使用中文。不要重复、复述或转述以上规则；只输出用户要求的最终结果和必要的简短说明。

      你是一位资深工程师。请根据需求卡片/描述完成以下任务。

      【任务流程】
      1. 首先生成技术文档（包含架构设计、数据模型、接口/组件设计、实现步骤），写入 {WORKSPACE_PATH}/dev-jobs/{工程名}/README.md 或 {WORKSPACE_PATH}/dev-jobs/{工程名}/docs/tech-spec.md。
      2. 如果用户尚未明确指定工程目录（即没有已选择的代码库或未提供工程名），完成技术文档后必须调用 `question` 工具向用户确认工程选择。调用格式如下：
          {
            "questions": [
              {
                "header": "技术文档已生成",
                "question": "请选择或输入一个工程目录名称。若目录不存在，将自动创建新工程。",
                "options": []
              }
            ]
          }
      3. 收到用户响应后，将响应中的工程名称作为 `{工程名}`，继续编写实现代码并写入 {WORKSPACE_PATH}/dev-jobs/{工程名}/ 目录。
      4. 如果用户选择的代码库已存在，优先在已有代码库目录下修改；如果用户输入了新工程名且目录不存在，则创建新工程并写入代码。

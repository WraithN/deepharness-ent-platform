# 聊天指令配置文件
# 每个指令定义以下字段：
#   cmd         - 指令名称（以 / 开头）
#   label       - 显示名称（前端菜单展示）
#   desc        - 描述说明
#   icon        - 图标名称（对应 lucide-react 图标）
#   allowTask   - 是否支持引用任务卡片（最多1个）
#   allowRepos  - 是否支持代码库
#   requireRepos - 是否必须选择代码库才能发送
#   maxRepos    - 最大代码库数量（0-2）
#   template    - 提示词模板，{ARGS} 占位符运行时替换为用户输入
#
# 扩展方式：在此文件中追加新的指令配置即可，无需修改代码。

commands:
  - cmd: "/prd-write"
    label: "写需求"
    desc: "生成结构化 PRD 文档"
    icon: "FileText"
    allowTask: true
    allowRepos: false
    requireRepos: false
    maxRepos: 0
    template: |
      你是一位资深产品经理。请根据以下需求描述，生成一份结构化的 PRD（产品需求文档）。

      【文件输出要求】
      1. 将 PRD 文档写入 {WORKSPACE_PATH}/projects/products-jobs/prd/ 目录下（如目录不存在请先创建）。
      2. 文件命名格式：{需求名称}-prd.md（例如：用户登录-prd.md）。需求名称从用户输入中提取关键词，使用中文或英文均可。
      3. 文档使用 Markdown 格式编写。

      【PRD 内容结构】
      1. 背景与目标
      2. 用户场景
      3. 功能详情
      4. 业务流程图（使用 Mermaid 语法）
      5. 数据埋点要求

      【输出标记】
      文档写入完成后，在回复末尾必须用以下格式标记文件路径（每行一个）：
      [[FILE:{WORKSPACE_PATH}/projects/products-jobs/prd/需求名称-prd.md]]
      注意：路径必须是绝对路径。

      【用户需求】
      {ARGS}

  - cmd: "/prd-research"
    label: "做调研"
    desc: "技术调研与方案选型"
    icon: "Compass"
    allowTask: true
    allowRepos: false
    requireRepos: false
    maxRepos: 0
    template: |
      你是一位资深技术分析师。请根据以下主题，进行深入的技术调研并生成一份结构化的调研报告。

      【文件输出要求】
      1. 将调研文档写入 {WORKSPACE_PATH}/projects/products-jobs/research/ 目录下（如目录不存在请先创建）。
      2. 文件命名格式：{调研主题}-research.md（例如：微服务选型-research.md）。
      3. 文档使用 Markdown 格式编写。

      【调研报告内容结构】
      1. 调研背景与目标
      2. 现状分析
      3. 方案对比（使用表格对比优劣）
      4. 推荐方案及理由
      5. 风险与注意事项
      6. 参考资料

      【输出标记】
      文档写入完成后，在回复末尾必须用以下格式标记文件路径（每行一个）：
      [[FILE:{WORKSPACE_PATH}/projects/products-jobs/research/调研主题-research.md]]
      注意：路径必须是绝对路径。

      【调研主题】
      {ARGS}

  - cmd: "/proto-make"
    label: "做原型"
    desc: "生成 UI 原型设计稿"
    icon: "LayoutTemplate"
    allowTask: true
    allowRepos: true
    requireRepos: false
    maxRepos: 2
    template: |
      你是一位全栈工程师。请根据以下需求，生成一个可运行的前端+后端工程原型。

      【工程输出要求】
      1. 将工程创建在 {WORKSPACE_PATH}/projects/ 目录下，工程目录名使用需求关键词的英文命名（如 {WORKSPACE_PATH}/projects/user-login/）。
      2. 前端使用 React + TypeScript + Tailwind CSS。
      3. 后端使用 Node.js（Express 或 Fastify）。
      4. 工程结构示例：
         {WORKSPACE_PATH}/projects/{工程名}/
         ├── frontend/    # React 前端
         │   ├── src/
         │   ├── package.json
         │   └── vite.config.ts
         └── backend/     # Node.js 后端
             ├── src/
             └── package.json
      5. 前端和后端都必须有完整的 package.json，确保可以 npm install && npm run dev 启动。

      【输出标记】
      工程创建完成后，在回复末尾必须用以下格式标记工程路径（每行一个）：
      [[PROJECT:{WORKSPACE_PATH}/projects/工程名]]
      注意：路径必须是绝对路径。

      【需求描述】
      {ARGS}

  - cmd: "/code"
    label: "写代码"
    desc: "根据需求编写代码"
    icon: "Code2"
    allowTask: true
    allowRepos: true
    requireRepos: true
    maxRepos: 2
    template: |
      你是一位资深工程师。请根据以下需求编写代码。

      【代码输出要求】
      1. 将代码写入 {WORKSPACE_PATH}/projects/ 目录下对应的工程中。
      2. 遵循该工程现有的代码风格和目录结构。
      3. 代码需包含必要的错误处理和注释。

      【输出标记】
      - 如果创建了整个工程，使用 [[PROJECT:绝对路径]] 标记。
      - 如果只是创建或修改单个文件，使用 [[FILE:绝对路径]] 标记。

      【需求描述】
      {ARGS}

  - cmd: "/debug"
    label: "解BUG"
    desc: "定位并修复缺陷"
    icon: "Bug"
    allowTask: true
    allowRepos: true
    requireRepos: false
    maxRepos: 2
    template: |
      你是一位资深工程师。请根据以下缺陷描述，定位并修复问题。

      【调试要求】
      1. 先分析可能的根因，再给出修复方案。
      2. 修改代码时直接使用工具写入文件，不要只给出建议。
      3. 修复完成后简要说明修改了哪些文件、修改原因。

      【输出标记】
      - 如果修改了整个工程中的多个文件，使用 [[PROJECT:绝对路径]] 标记工程根目录。
      - 如果只修改了单个文件，使用 [[FILE:绝对路径]] 标记。

      【缺陷描述】
      {ARGS}

  - cmd: "/review"
    label: "代码Review"
    desc: "审查代码质量与规范"
    icon: "CheckCircle"
    allowTask: true
    allowRepos: true
    requireRepos: true
    maxRepos: 2
    template: |
      你是一位资深代码审查专家。请对以下代码或工程进行 Code Review。

      【审查要求】
      1. 从代码质量、安全性、性能、可维护性四个维度进行审查。
      2. 对每个问题给出严重程度（严重/警告/建议）和具体修改建议。
      3. 审查结果以 Markdown 格式输出。

      【输出标记】
      如果审查过程中修改了代码，使用 [[FILE:绝对路径]] 或 [[PROJECT:绝对路径]] 标记修改的文件/工程。

      【审查目标】
      {ARGS}

  - cmd: "/unit-test"
    label: "生成单测"
    desc: "为代码生成单元测试"
    icon: "FlaskConical"
    allowTask: true
    allowRepos: true
    requireRepos: true
    maxRepos: 2
    template: |
      你是一位资深测试工程师。请根据以下代码或需求，生成完整的单元测试。

      【测试要求】
      1. 覆盖正常路径、异常路径与边界条件。
      2. 测试代码写入对应工程的 tests/ 目录或与被测文件同目录。
      3. 使用项目现有测试框架（如 Jest / Vitest / pytest）。

      【输出标记】
      - 创建单个测试文件使用 [[FILE:绝对路径]] 标记。
      - 如涉及多个文件使用 [[PROJECT:绝对路径]] 标记。

      【目标代码/需求】
      {ARGS}

  - cmd: "/test-case"
    label: "生成测试用例"
    desc: "生成结构化测试用例"
    icon: "ClipboardList"
    allowTask: true
    allowRepos: false
    requireRepos: false
    maxRepos: 0
    template: |
      你是一位资深测试工程师。请根据以下需求或功能描述，生成结构化的测试用例。

      【文件输出要求】
      1. 将测试用例文档写入 {WORKSPACE_PATH}/projects/products-jobs/test-cases/ 目录下。
      2. 文件命名格式：{功能名称}-test-cases.md。
      3. 每条用例包含：用例编号、标题、前置条件、操作步骤、预期结果、优先级。

      【输出标记】
      [[FILE:{WORKSPACE_PATH}/projects/products-jobs/test-cases/功能名称-test-cases.md]]

      【功能描述】
      {ARGS}

  - cmd: "/auto-test"
    label: "自动化脚本"
    desc: "生成自动化测试脚本"
    icon: "Terminal"
    allowTask: true
    allowRepos: true
    requireRepos: false
    maxRepos: 1
    template: |
      你是一位资深测试开发工程师。请根据以下需求或接口，生成可运行的自动化测试脚本。

      【脚本要求】
      1. 脚本写入 {WORKSPACE_PATH}/projects/ 对应工程的 tests/ 或 e2e/ 目录。
      2. 优先使用 Playwright / Cypress / Jest 等常见工具，并说明运行方式。
      3. 包含关键断言与用例说明。

      【输出标记】
      [[FILE:绝对路径]] 或 [[PROJECT:绝对路径]]

      【目标需求/接口】
      {ARGS}

  - cmd: "/bug-analysis"
    label: "BUG分析"
    desc: "分析缺陷根因与影响"
    icon: "Search"
    allowTask: true
    allowRepos: false
    requireRepos: false
    maxRepos: 0
    template: |
      你是一位资深测试分析师。请根据以下缺陷现象，进行根因分析并评估影响范围。

      【分析要求】
      1. 列出可能的根因假设并给出验证思路。
      2. 评估对功能、性能、用户体验的影响。
      3. 输出修复建议与回归测试重点。

      【输出标记】
      如需写入文件，使用 [[FILE:绝对路径]] 标记。

      【缺陷现象】
      {ARGS}

  - cmd: "/test-report"
    label: "测试报告"
    desc: "生成测试报告"
    icon: "FileBarChart"
    allowTask: true
    allowRepos: false
    requireRepos: false
    maxRepos: 0
    template: |
      你是一位资深测试经理。请根据以下测试执行情况或数据，生成一份测试报告。

      【报告内容】
      1. 测试范围与目标
      2. 测试执行摘要（用例数、通过/失败数、阻塞数）
      3. 缺陷统计与严重度分布
      4. 风险评估与发布建议
      5. 遗留问题与后续计划

      【输出标记】
      [[FILE:{WORKSPACE_PATH}/projects/products-jobs/reports/测试报告.md]]

      【测试数据/描述】
      {ARGS}

  - cmd: "/ui-spec"
    label: "UI规范"
    desc: "生成 UI 设计规范"
    icon: "Layout"
    allowTask: true
    allowRepos: false
    requireRepos: false
    maxRepos: 0
    template: |
      你是一位资深 UI 设计师。请根据以下需求，生成一份 UI 设计规范文档。

      【文档内容】
      1. 色彩规范（主色、辅助色、状态色、文字色）
      2. 字体与字号规范
      3. 间距与圆角规范
      4. 按钮、输入框、卡片等组件样式规范
      5. 布局栅格示例

      【输出标记】
      [[FILE:{WORKSPACE_PATH}/projects/products-jobs/design/需求名称-ui-spec.md]]

      【需求描述】
      {ARGS}

  - cmd: "/design-review"
    label: "设计走查"
    desc: "检查设计稿与实现一致性"
    icon: "Eye"
    allowTask: true
    allowRepos: false
    requireRepos: false
    maxRepos: 0
    template: |
      你是一位资深设计走查专家。请根据以下设计稿或实现描述，检查设计还原与一致性。

      【走查维度】
      1. 视觉还原（颜色、字体、间距、圆角）
      2. 交互流程与状态完整性
      3. 响应式与可访问性
      4. 设计 Token 使用是否一致

      【输出标记】
      如需写入文件，使用 [[FILE:绝对路径]] 标记。

      【设计稿/实现描述】
      {ARGS}

  - cmd: "/design-token"
    label: "Design Token"
    desc: "生成 Design Token 定义"
    icon: "Palette"
    allowTask: true
    allowRepos: false
    requireRepos: false
    maxRepos: 0
    template: |
      你是一位资深设计系统专家。请根据以下品牌或设计需求，生成一份 Design Token 定义。

      【Token 要求】
      1. 包含颜色、字体、间距、圆角、阴影、断点等维度。
      2. 输出为 JSON 或 CSS 变量格式，便于代码使用。
      3. 命名语义清晰，支持层级扩展。

      【输出标记】
      [[FILE:{WORKSPACE_PATH}/projects/products-jobs/design/tokens.json]]

      【品牌/设计需求】
      {ARGS}

  - cmd: "/user-story"
    label: "用户故事拆分"
    desc: "将需求拆分为用户故事"
    icon: "ListChecks"
    allowTask: true
    allowRepos: false
    requireRepos: false
    maxRepos: 0
    template: |
      你是一位资深产品经理。请根据以下需求，拆分为结构化的用户故事与验收标准。

      【输出要求】
      1. 每条用户故事遵循 "作为...，我希望...，以便..." 格式。
      2. 包含验收标准（AC），使用 Given/When/Then 描述。
      3. 输出按优先级与模块分组。

      【输出标记】
      [[FILE:{WORKSPACE_PATH}/projects/products-jobs/stories/需求名称-user-stories.md]]
      [[CARD:user_story]]

      【需求描述】
      {ARGS}

  - cmd: "/data-analysis"
    label: "数据分析"
    desc: "分析数据并生成洞察"
    icon: "BarChart3"
    allowTask: true
    allowRepos: false
    requireRepos: false
    maxRepos: 0
    template: |
      你是一位资深数据分析师。请根据以下数据或分析目标，生成数据洞察报告。

      【报告内容】
      1. 分析目标与指标说明
      2. 数据清洗与假设说明
      3. 关键指标与趋势分析
      4. 洞察结论与行动建议
      5. 可视化建议（图表类型）

      【输出标记】
      [[FILE:{WORKSPACE_PATH}/projects/products-jobs/analysis/分析主题.md]]

      【数据/分析目标】
      {ARGS}

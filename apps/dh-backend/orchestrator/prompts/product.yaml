# 产品流程提示词模板
# 使用 Go text/template 语法，变量通过 {{.VarName}} 引用。
# 条件块使用 {{if .Var}}...{{end}}。

product_brainstorm: |
  /grill-me

  你是一位资深产品经理。请基于任务卡片内容，通过逐个提问的方式澄清需求，最终生成一份需求设计文档草案。

  【核心规则：先输出问题和选项，再调用工具】
  每次提问时，先输出问题正文和备选选项作为文本消息（用户可见），然后立即调用 question 工具。
  不要输出分析过程，直接输出问题和选项。
  每次用户回答后，简短确认（一句话），然后继续输出下一个问题和选项并调用 question 工具。
  提问总数控制在 1～5 个之间，当需求已经澄清时即可停止提问，不必强行凑满 5 个。

  【输出格式（必须严格遵守）】
  先输出以下格式的文本（不要放在代码块中，直接输出纯文本）：

  问题正文
  A. 选项一说明
  B. 选项二说明
  C. 选项三说明

  然后立即调用 question 工具，参数如下：
  {"questions":[{"header":"简短标签","question":"问题正文","options":[]}]}

  规则：
  1. 文本中至少提供 2 个选项（A 和 B），建议 3 个。
  2. 选项格式为：字母. 说明文字（一行一个选项）。
  3. question 工具的 question 字段只填问题正文（不含选项）。
  4. question 工具的 options 字段填空数组。
  5. 每次只提一个问题。
  6. 在用户回答一个问题后，必须先简短确认，然后继续提下一个问题，禁止直接开始生成文档或执行文件写入。

  【JSON 安全规则（极重要）】
  - JSON 字符串值内部禁止出现英文双引号。如需引用词语，使用书名号或直接不加引号。
  - 例如，不要写 "需求提到"内容范围"可配置"，应写 "需求提到内容范围可配置" 或 "需求提到「内容范围」可配置"。

  【提问覆盖维度（按需覆盖）】
  根据需求内容，按需覆盖以下维度，每个维度最多提一个问题，总提问数控制在 1～5 个：
  1. 核心场景：用户在什么场景下使用？推送什么内容？
  2. 用户角色：谁配置？谁接收？是否有权限要求？
  3. 内容范围：推送哪些数据？时间范围？筛选条件？
  4. 业务规则：频次/时间点？失败处理？数量限制？
  5. 优先级与依赖：依赖哪些已有功能？MVP 范围？

  【结束条件】
  当 1～5 个问题已经足够澄清需求，或用户已明确表达无需继续提问时，即可告知用户"需求已澄清，即将生成需求设计文档草案"，然后生成文档。
  如果还有关键维度未澄清，必须继续提问，禁止提前结束提问流程。

  【需求设计文档草案输出要求】
  基于任务卡片内容以及用户的回答，生成一份需求设计文档草案：
  【文件输出要求】
  1. 将文档写入 {{.WorkspacePath}}/pm-jobs/brainstorm/ 目录下（如目录不存在请先创建）。
  2. 文件命名格式：{需求关键词}-brainstorm.md。
  3. 文档使用 Markdown 格式编写。
  4. 文档使用 Markdown 格式编写，包含以下结构：
     - 需求背景与目标
     - 用户角色与场景
     - 功能需求详情
     - 业务规则与约束
     - 验收标准
     - 非功能性需求
     - 开放问题与后续跟进

  【输出标记】
  在回复末尾用 [[FILE:文件完整路径]] 标记你实际创建的需求设计文档草案文件。
  务必使用真实的文件系统绝对路径，不要使用占位符。

  【补充说明】
  任务卡片内容已自动附加在上方。本指令要求必须提供需求卡片；收到需求卡片后，在澄清完成时必须输出一份需求设计文档草案，禁止只输出问题而不输出文档。
  标题: {{.Title}}
  {{if .Description}}描述: {{.Description}}{{end}}

product_research: |
  /prd-research

  你是一位资深产品经理 + UI/UX 设计师 + 前端工程师。请根据以下需求和已抓取的网页内容，对目标网站进行深入的产品调研分析，并产出以下四个产物。

  【分析要求】
  1. 仔细阅读已抓取网页内容，理解目标网站的核心功能、信息架构、交互流程与视觉风格。
  2. 若抓取内容为空或不足，请基于 URL 给出合理的分析建议。

  【文件输出要求】
  1. 在 {{.WorkspacePath}}/pm-jobs/prd-research/ 目录下创建本次任务目录，目录名使用网站域名或简短英文标识。
  2. 必须生成以下四个产物：
     - 产品分析文档：{{.WorkspacePath}}/pm-jobs/prd-research/{标识}/产品分析.md
     - 功能列表：{{.WorkspacePath}}/pm-jobs/prd-research/{标识}/功能列表.md
     - UI 设计文档：{{.WorkspacePath}}/pm-jobs/prd-research/{标识}/design.md
     - 原型项目：{{.WorkspacePath}}/pm-jobs/prd-research/{标识}/prototype/

  3. 产品分析.md：产品定位与目标用户、核心功能概述、信息架构、关键页面与交互流程、商业模式分析、竞品差异化分析、优缺点总结与改进建议。
  4. 功能列表.md：表格形式，含功能名称、功能描述、优先级、所在页面、交互说明。
  5. design.md：设计风格概述、色彩系统、字体与字号规范、间距与圆角规范、组件规范、关键页面布局说明。
  6. 原型：React 18 + TypeScript + Tailwind CSS + Vite，mock 数据还原真实数据结构，data-dh-id 标注，pnpm install && pnpm build。

  【输出标记】
  - 文档用 [[FILE:文件完整路径]] 标记。
  - 原型工程用 [[PROJECT:工程完整路径]] 标记。

  【需求信息】
  标题: {{.Title}}
  {{if .BreakdownResult}}功能拆解清单: {{.BreakdownResult}}{{end}}

product_draft: |
  你是一位资深产品经理。请根据以下调研结论，输出一份初步业务方案草案。

  【文件输出要求】
  1. 将文档写入 {{.WorkspacePath}}/pm-jobs/draft/ 目录下（如目录不存在请先创建）。
  2. 文件命名格式：{需求关键词}-draft.md。
  3. 文档使用 Markdown 格式编写。
  4. 文档使用 Markdown 格式编写，包含以下结构：
     - 背景与目标
     - 业务方案概述
     - 关键模块与功能
     - 风险点提示
     - 下一步建议

  【输出标记】
  在回复末尾用 [[FILE:文件完整路径]] 标记你实际创建的草案文件。
  务必使用真实的文件系统绝对路径，不要使用占位符。

  【调研结论】
  {{.ResearchResult}}

  【需求标题】
  {{.Title}}

product_prd_write: |
  /prd-write

  你是一位资深产品经理。请根据以下定稿方案，生成一份结构化的 PRD（产品需求文档）。

  【文件输出要求】
  1. 将文档写入 {{.WorkspacePath}}/pm-jobs/prd/ 目录下（如目录不存在请先创建）。
  2. 文件命名格式：{需求名称}-prd.md。
  3. 文档使用 Markdown 格式编写。
  4. 文档使用 Markdown 格式编写。
  5. PRD 内容结构：
     1. 背景与目标
     2. 用户场景
     3. 功能详情
     4. 业务流程图（使用 Mermaid 语法）
     5. 数据埋点要求

  【输出标记】
  文档写入完成后，在回复末尾必须用以下格式标记文件路径（每行一个）：
  [[FILE:{{.WorkspacePath}}/pm-jobs/prd/{需求名称}-prd.md]]
  注意：路径必须是绝对路径。

  【定稿方案】
  {{.DraftResult}}

  【需求标题】
  {{.Title}}

product_proto_make: |
  /proto-make

  你是一位前端工程师与 UI 设计师。请根据以下 PRD 生成可运行的前端原型。

  【工程输出要求】
  1. 将工程创建在 {{.WorkspacePath}}/pm-jobs/prototypes/ 目录下，工程目录名使用需求关键词的英文命名。
  2. 使用 React 18 + TypeScript + Tailwind CSS + Vite。
  3. 不需要后端服务；所有数据使用本地 mock 数据。
  4. 关键组件/可点击元素必须添加稳定的 data-dh-id 属性。
  5. 工程必须包含 `pnpm run dev` 用于本地预览，以及 `pnpm run build` 用于构建生产包。
  6. 所有文件创建完成后，只执行一次 `pnpm install && pnpm run build`，确保产出 `dist/index.html` 和 `dist/assets/`。

  【输出标记】
  工程创建完成后，在回复末尾仅输出一个工程根目录标记，不要输出 [[FILE:...]] 标记：
  [[PROJECT:{{.WorkspacePath}}/pm-jobs/prototypes/{工程名}]]
  务必使用真实的文件系统绝对路径，不要使用占位符。
  同时根据需求标题或 PRD 内容，总结一个简短的中文需求名，并用 [[REQ_NAME:需求名]] 标记输出。

  【定稿方案】
  {{.DraftResult}}

  【需求标题】
  {{.Title}}

product_proto_review: |
  你是一位资深产品评审专家。请根据以下 PRD 与原型，对原型进行复查，检查交互一致性与需求覆盖度。

  【复查维度】
  1. 页面流程是否与 PRD 一致
  2. 关键功能是否在原型中有对应页面/交互
  3. 文案、字段、状态是否满足 PRD 要求
  4. 明显的交互缺失或错误

  【输出格式要求】
  请按以下格式输出评审结论（全部使用中文）：

  ---
  ## 原型复查结论
  - **综合结论**: (通过 / 不通过)
  - **问题列表**: （若通过可写"无明显问题"）
    1. ...
    2. ...
  - **修改建议**: （若通过可省略）
  ---

  注意：综合结论必须是明确的二选一，不允许模糊结论。

  【PRD】
  {{.PRDResult}}

  【原型信息】
  {{.ProtoResult}}

  【需求标题】
  {{.Title}}

product_breakdown: |
  你是一位资深产品经理。请基于以下需求要点，进行功能拆解，产出功能拆解清单与模块关系图。

  【文件输出要求】
  1. 将文档写入 {{.WorkspacePath}}/pm-jobs/breakdown/ 目录下（如目录不存在请先创建）。
  2. 文件命名格式：{需求关键词}-breakdown.md。
  3. 文档使用 Markdown 格式编写，包含以下结构：
     - 功能模块划分
     - 功能清单（表格：功能名称、描述、优先级、所属模块）
     - 模块关系图（使用 Mermaid 语法）
     - 依赖与约束

  【输出标记】
  在回复末尾用 [[FILE:文件完整路径]] 标记你实际创建的文件。
  务必使用真实的文件系统绝对路径，不要使用占位符。

  【需求要点】
  {{.BrainstormResult}}

  【需求标题】
  {{.Title}}

product_ai_draft_review: |
  你是一位资深产品评审专家。请对以下业务方案草案进行自动复核，从完整性、一致性、可行性三个维度检查，并输出复核结论。

  【复核维度】
  1. 完整性：功能模块是否覆盖核心需求，是否有明显遗漏。
  2. 一致性：模块间逻辑是否自洽，是否存在冲突。
  3. 可行性：技术约束是否合理，是否存在明显风险。

  【输出格式要求】
  请按以下格式输出（全部使用中文）：

  ---
  ## AI 草案复核结论
  - **复核结论**: (pass / reject)
  - **问题列表**: （若 pass 可写「无明显问题」）
    1. ...
    2. ...
  - **改进建议**: （若 pass 可省略）
  ---

  注意：复核结论必须是明确的二选一，pass 表示草案可进入人工复核，reject 表示需重新生成草案。

  【方案草案】
  {{.DraftResult}}

  【需求标题】
  {{.Title}}

product_ai_gateway: |
  你是一位资深产品经理。请根据以下定稿方案，判断该需求是否需要生成 UI 交互原型。

  【决策规则】
  - 若需求涉及用户界面、页面交互、可视化展示，则 NEED_PROTO 为 true（需要原型）。
  - 若需求仅为后端逻辑、数据接口、定时任务等无 UI 场景，则 NEED_PROTO 为 false（仅 PRD）。
  - 不确定时默认 true，宁可有原型补充细节。

  【输出格式要求】
  请在回复末尾输出一行决策标记（必须严格匹配格式）：

  NEED_PROTO: true

  或

  NEED_PROTO: false

  【定稿方案】
  {{.DraftResult}}

  【需求标题】
  {{.Title}}

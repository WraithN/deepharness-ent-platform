# 测试流程提示词模板
# 使用 Go text/template 语法，变量通过 {{.VarName}} 引用。

test_plan_design: |
  /code

  【语言要求】
  你的所有回复必须使用中文，包括思考过程、工具调用说明、错误分析等内部推理文本也使用中文。不要重复、复述或转述以上规则；只输出用户要求的最终结果和必要的简短说明。

  你是一位资深测试架构师。请根据以下需求信息，设计一份结构化的测试方案。

  【工程目录】
  请在 {{.WorkspacePath}}/dev-jobs/ 目录下找到对应工程，在工程根目录下创建 docs/test-plan.md 文件。

  【测试方案输出要求】
  测试方案文档（docs/test-plan.md）必须包含以下章节：
  1. **测试目标与范围**：明确本次测试的业务目标、覆盖的功能模块
  2. **测试策略**：单元测试、集成测试、端到端测试的分配比例和优先级
  3. **测试环境**：所需的环境配置、依赖服务、数据准备
  4. **测试用例规划**：按功能模块分组的用例大纲（不需要具体用例，只需分类和数量预估）
  5. **自动化测试方案**：可自动化的用例比例、自动化框架选择、脚本目录规划
  6. **风险评估**：测试中可能遇到的风险和应对措施
  7. **验收标准**：测试通过的准入和准出标准

  【需求信息】
  标题: {{.Title}}
  {{if .Description}}描述: {{.Description}}{{end}}

test_case_gen: |
  /code

  【语言要求】
  你的所有回复必须使用中文。不要重复、复述或转述以上规则；只输出用户要求的最终结果和必要的简短说明。

  你是一位资深测试工程师。请根据以下测试方案，生成具体的测试用例并编写自动化测试脚本。

  【工程目录】
  请在 {{.WorkspacePath}}/dev-jobs/ 目录下找到对应工程，在工程根目录下创建 tests/ 目录存放测试文件。

  【用例生成要求】
  1. 根据测试方案中的用例规划，生成具体的测试用例
  2. 每个用例包含：用例编号、用例名称、前置条件、测试步骤、预期结果、优先级
  3. 将用例列表写入 docs/test-cases.md 文件
  4. 为可自动化的用例编写测试脚本，使用 Vitest + React Testing Library
  5. 测试脚本放在 tests/ 目录下，按功能模块组织

  【测试方案】
  {{.TestPlan}}

test_auto_exec: |
  /code

  【语言要求】
  你的所有回复必须使用中文。不要重复、复述或转述以上规则；只输出用户要求的最终结果和必要的简短说明。

  你是一位资深自动化测试工程师。请执行工程中的自动化测试脚本，收集测试结果并生成报告。

  【执行要求】
  1. 在 {{.WorkspacePath}}/dev-jobs/ 目录下找到对应工程
  2. 安装测试依赖（如未安装）
  3. 运行 tests/ 目录下的全部测试脚本
  4. 收集测试结果，包括：通过数、失败数、跳过数、总耗时
  5. 将测试结果报告写入 docs/test-exec-report.md 文件
  6. 对失败的用例记录详细错误信息

test_defect_verify: |
  /code

  【语言要求】
  你的所有回复必须使用中文。不要重复、复述或转述以上规则；只输出用户要求的最终结果和必要的简短说明。

  你是一位资深质量工程师。请根据测试执行报告，识别缺陷并修复，然后重新验证。

  【缺陷处理流程】
  1. 分析测试执行报告中失败的用例，定位缺陷根因
  2. 对每个缺陷进行修复（修改源代码，不修改测试用例）
  3. 修复后重新运行失败的测试用例，确认修复有效
  4. 将缺陷分析和修复记录写入 docs/defect-report.md 文件
  5. 缺陷报告需包含：缺陷编号、严重程度、根因分析、修复方案、验证结果

  【工程目录】{{.WorkspacePath}}/dev-jobs/

  【测试执行报告】
  {{.ExecReport}}

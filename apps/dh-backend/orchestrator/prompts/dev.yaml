# 研发流程提示词模板
# 使用 Go text/template 语法，变量通过 {{.VarName}} 引用。

dev_code: |
  /code

  你是一位资深工程师。请根据以下需求完成开发任务。

  【工程目录】
  {{if .ProjectName}}请在 {{.WorkspacePath}}/dev-jobs/{{.ProjectName}} 目录下进行开发。如果已有对应工程目录请在其下修改，否则创建新工程。
  {{else}}请在 {{.WorkspacePath}}/dev-jobs/ 目录下进行开发。请根据需求描述生成与需求适配的工程名（英文小写、连字符分隔），在 dev-jobs/ 目录下创建该工程。
  {{end}}
  【技术栈】
  前端：React 18 + Vite + TypeScript + Tailwind CSS v3
  UI 组件库：shadcn/ui（基于 Radix UI）
  路由：react-router-dom v7
  状态管理：React Hooks + Context
  图标库：lucide-react
  构建工具：Vite
  请使用上述技术栈初始化项目并实现完整功能。

  {{if or .DocInfo .ProtoInfo}}【关联设计产物】
  以下是与本需求关联的设计文档和原型，请在实现时参考其内容和结构：
  {{if .DocInfo}}{{.DocInfo}}
  {{end}}{{if .ProtoInfo}}{{.ProtoInfo}}
  {{end}}
  {{end}}【代码输出要求】
  1. 遵循工程现有的代码风格和目录结构。
  2. 代码需包含必要的错误处理和注释。
  3. 完成后使用 [[PROJECT:工程完整路径]] 标记输出。

  【需求描述】
  标题: {{.Title}}
  {{if .Description}}描述: {{.Description}}{{end}}

dev_review: |
  你是一位资深代码审查专家。请对以下工程进行代码审查。

  【审查要求】
  1. 从代码质量、安全性、性能、可维护性四个维度进行审查。
  2. 对每个问题给出严重程度（致命/严重/一般/轻微）和具体修改建议。
  3. 审查结果以中文 Markdown 格式输出，写入评审报告文件。

  【评审报告输出】
  1. 将完整评审报告写入被审查工程目录下的 .review/review-{YYYY-MM-DD-HHmmss}.md 文件。
  2. 报告格式要求：
     - 顶部包含工程名、分支、当前 commit hash 信息
     - 按严重程度分组列出所有问题（致命、严重、一般、轻微）
     - 每个问题包含：文件路径、行号、问题描述、修改建议
     - 底部包含评审总结
  3. 报告中所有描述性文字必须使用中文，代码片段除外。

  【重要：结构化评审数据输出】
  完成评审并写入报告文件后，你必须在回复中输出结构化评审数据。
  使用 [[REVIEW_REPORT_START]] 作为起始标记，中间是一个完整的 JSON 对象，使用 [[REVIEW_REPORT_END]] 作为结束标记。
  JSON 中必须包含 issues 数组，每个问题对应一条记录。

  【重要：评审结论标记】
  回复的最后一行必须单独输出结论标记，格式严格为：
  评审结论：pass
  或
  评审结论：reject
  其中 pass 表示代码质量达标（无致命/严重问题），可进入人工评审；reject 表示存在致命/严重问题，需返回 AI 开发修复。不允许输出其他取值或省略该行。

  【审查目标】
  工程路径: {{.WorkspacePath}}/dev-jobs/

dev_requirement_eval: |
  你是一位资深技术架构师和需求分析师。请对以下软件需求进行评估分析，判断该需求是否适合由 AI 自动完成开发，输出结构化的评估结论。

  【评估维度】
  1. 系统边界：判断需求属于单系统还是多系统（涉及多个独立子系统或模块）
  2. 预估文件数：根据需求描述估算需要创建/修改的文件数量范围
  3. 复杂度：评估需求实现的技术复杂度（低/中/高）
  4. 技术栈匹配度：确认需求是否与现有技术栈（React 18 + Vite + TypeScript + Tailwind CSS v3 + shadcn/ui）良好匹配
  5. 结论：给出综合评估，建议「可 AI 开发（通过）」还是「需人工介入（不通过）」

  【输出格式要求】
  请按以下格式输出评估报告（全部使用中文）：
  ---
  ## 需求评估报告
  - **系统边界**: (单系统 / 多系统，并简要说明)
  - **预估文件数**: (如 5-10 个文件)
  - **复杂度**: (低 / 中 / 高)
  - **技术栈匹配度**: (匹配 / 部分匹配 / 不匹配，简要说明)
  - **综合结论**: (可 AI 开发 / 需人工介入，并说明理由)
  ---

  注意：评估应基于需求描述的客观分析，不要过度解读或假设未提及的内容。综合分析结论必须是一个明确的二选一建议：要么「可 AI 开发」，要么「需人工介入」，不允许给出模糊的中间结论。

  【需求信息】
  标题: {{.Title}}
  {{if .Description}}描述: {{.Description}}{{end}}

dev_arch_design: |
  /code

  你是一位资深系统架构师。请根据以下需求信息，生成一份结构化的技术设计文档。

  【工程目录】
  请在 {{.WorkspacePath}}/dev-jobs/ 目录下进行设计。根据需求描述生成合适的工程名（英文小写、连字符分隔），在工程根目录下创建 docs/architecture.md 文件。

  【技术栈】
  前端：React 18 + Vite + TypeScript + Tailwind CSS v3
  UI 组件库：shadcn/ui（基于 Radix UI）
  路由：react-router-dom v7
  状态管理：React Hooks + Context
  图标库：lucide-react
  构建工具：Vite

  【文档输出要求】
  技术设计文档（docs/architecture.md）必须包含以下章节：
  1. **设计目标与背景**：明确本次设计的业务目标、要解决的核心问题
  2. **总体架构图**：使用 Mermaid 语法绘制系统整体架构图，展示各模块/组件的组织关系
  3. **模块/组件划分与职责**：
     - 页面结构树（路由规划，含页面与组件的所属关系）
     - 组件拆分明细（组件名、所属页面、作用、Props、State、是否全局通用、预估代码行数）
  4. **目录结构设计**：完整的 src/ 目录树规划，每个文件标注"新建"或"修改"
  5. **数据模型设计**：
     - 核心实体 TypeScript 接口/类型定义
     - 实体间关系说明
     - 如有持久化需求，说明存储方案（localStorage / IndexedDB / 后端 API）
  6. **路由与页面设计**：
     - 完整路由表（路径、页面组件、Layout、是否需要认证）
     - 页面加载策略（同步/懒加载）
  7. **数据流设计**：
     - 状态管理方案（React Context / Props 传递）
     - 关键交互流程时序图（Mermaid 语法绘制）
  8. **技术选型与理由**：列出选用的核心技术和设计决策依据
  9. **非功能性考虑**：性能优化策略、安全考虑、可扩展性、可维护性
  10. **实现步骤与里程碑**：按优先级划分开发阶段，每阶段包含目标、产出物和预估工作量
  11. **风险与回滚策略**：识别潜在风险并提供应对方案

  【格式要求】
  1. 文档使用 Markdown 格式编写，中文描述，代码片段使用 TypeScript/TSX
  2. 架构图和时序图使用 Mermaid 代码块（graph TD / sequenceDiagram）
  3. 完成文档写入后，在回复中使用 [[FILE:文件完整路径]] 标记输出

  【需求信息】
  标题: {{.Title}}
  {{if .Description}}描述: {{.Description}}{{end}}

dev_optimize: |
  /code

  你是一位资深工程师。请根据以下代码评审报告和人工修改指示对工程代码进行修复。

  【修复要求】
  1. 严格根据评审报告中的问题逐项修复，优先处理致命和严重级别的问题。
  2. 修复后确保代码可编译运行，不引入新的问题。
  3. 保持原有代码风格和架构不变。

  {{if .DeveloperPrompt}}【人工修改指示】
  {{.DeveloperPrompt}}

  {{end}}
  【代码评审报告】
  {{.ReviewReport}}

dev_ai_eval: |
  你是一位资深技术架构评审专家。请对以下方案设计文档进行智能评估，判定方案是否可用于开发，输出一份结构化的评估报告。

  【评估维度】
  1. **架构合理性**：模块划分是否清晰、层次是否分明、职责是否单一
  2. **技术选型**：技术栈选择是否合适、是否与需求匹配
  3. **可扩展性**：方案是否便于后续扩展和维护
  4. **风险评估**：是否存在潜在的技术风险或遗漏
  5. **完整度**：设计文档是否覆盖了需求的所有关键点

  【输出格式】
  请按以下格式输出评估报告：
  - **架构合理性**: (优 / 良 / 需改进，简要说明)
  - **技术选型**: (合适 / 部分合适 / 不合适，简要说明)
  - **可扩展性**: (优 / 良 / 需改进，简要说明)
  - **风险评估**: (低 / 中 / 高，列出主要风险点)
  - **完整度**: (完整 / 基本完整 / 有遗漏，列出遗漏项)
  - **综合结论**: (方案可用于开发 / 方案需重新设计，并说明理由)

  【重要：评估结论标记】
  评估报告的最后一行必须单独输出结论标记，格式严格为：
  评估结论：pass
  或
  评估结论：reject
  其中 pass 表示方案可用于开发，reject 表示方案存在重大问题需重新设计。不允许输出其他取值或省略该行。

  【需求信息】
  标题: {{.WorkitemTitle}}
  {{if .WorkitemDesc}}描述: {{.WorkitemDesc}}{{end}}

  【方案设计文档】
  {{.ArchDesignResult}}

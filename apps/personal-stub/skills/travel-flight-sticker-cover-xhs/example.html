<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>爆款机票贴纸封面</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #222;
        color: #111111;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        overflow-x: hidden;
      }

      .responsive-stage {
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        overflow: hidden;
      }

      .canvas {
        position: relative;
        width: 1080px;
        min-height: 1440px;
        margin: 0 auto;
        padding: 64px;
        overflow: hidden;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.08) 25%, transparent 25%) 0 0 / 72px 72px,
          linear-gradient(180deg, #faff5b 0%, #ffffff 45%, #e8f7ff 100%);
      }

      .responsive-stage > .canvas {
        margin: 0;
        transform-origin: top left;
      }

      .mock {
        position: absolute;
        left: 70px;
        right: 70px;
        bottom: 220px;
        display: grid;
        gap: 18px;
        transform: rotate(-3deg);
        opacity: 0.92;
      }

      .ticket {
        display: grid;
        grid-template-columns: 1fr 190px;
        gap: 22px;
        padding: 28px;
        border-radius: 28px;
        background: #ffffff;
        border: 4px solid #111111;
        box-shadow: 10px 10px 0 #111111;
      }

      .ticket b {
        display: block;
        font-size: 32px;
      }

      .ticket span {
        display: block;
        margin-top: 10px;
        color: #4b5563;
        font-size: 23px;
        line-height: 1.32;
        font-weight: 700;
      }

      .ticket .price {
        align-self: center;
        justify-self: end;
        color: #ff2a6d;
        font-size: 44px;
        font-weight: 950;
      }

      .label-row {
        position: relative;
        z-index: 2;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 70px;
      }

      .label {
        padding: 13px 19px;
        border-radius: 999px;
        background: #111111;
        color: #ffffff;
        font-size: 26px;
        font-weight: 950;
        border: 4px solid #111111;
      }

      .label.green {
        background: #5cff6c;
        color: #111111;
      }

      h1 {
        position: relative;
        z-index: 2;
        margin: 0;
        max-width: 940px;
        color: #ffffff;
        font-size: 114px;
        line-height: 1.02;
        letter-spacing: 0;
        text-shadow:
          5px 0 #111111,
          -5px 0 #111111,
          0 5px #111111,
          0 -5px #111111,
          10px 10px 0 #19e65b,
          16px 16px 0 #111111;
      }

      .marker {
        position: relative;
        z-index: 2;
        display: inline-block;
        margin-top: 36px;
        padding: 18px 28px;
        transform: rotate(-2deg);
        background: #ffffff;
        border: 5px solid #111111;
        box-shadow: 9px 9px 0 #0187ff;
        font-size: 42px;
        line-height: 1.16;
        font-weight: 950;
      }

      .price-burst {
        position: relative;
        z-index: 2;
        width: 470px;
        margin-top: 62px;
        padding: 28px 32px;
        transform: rotate(4deg);
        border-radius: 36px;
        background: #ff2a6d;
        color: #ffffff;
        border: 6px solid #111111;
        box-shadow: 12px 12px 0 #111111;
      }

      .price-burst span {
        display: block;
        font-size: 25px;
        font-weight: 900;
      }

      .price-burst b {
        display: block;
        margin-top: 4px;
        font-size: 78px;
        line-height: 0.98;
      }

      .bottom-note {
        position: absolute;
        z-index: 3;
        left: 64px;
        right: 64px;
        bottom: 48px;
        padding: 22px 28px;
        border-radius: 24px;
        background: #111111;
        color: #ffffff;
        font-size: 25px;
        line-height: 1.36;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="responsive-stage">
    <main class="canvas">
      <div class="label-row">
        <span class="label green">机票攻略</span>
        <span class="label">联程避坑</span>
        <span class="label">建议收藏</span>
      </div>

      <h1>巧用联程机票<br />往返省一半?</h1>
      <div class="marker">低价不是白捡<br />先看这 5 项再下单</div>

      <section class="price-burst">
        <span>预算差超过 30%</span>
        <b>才值得算</b>
      </section>

      <section class="mock" aria-label="模拟航班结果">
        <article class="ticket">
          <div>
            <b>上海 → 东京 · 首尔 → 上海</b>
            <span>不同票号 / 跨机场 / 需确认行李是否直挂</span>
          </div>
          <div class="price">¥1680</div>
        </article>
        <article class="ticket">
          <div>
            <b>直飞往返同航司</b>
            <span>时间更稳, 退改和行李规则更清晰</span>
          </div>
          <div class="price">¥2380</div>
        </article>
      </section>

      <div class="bottom-note">示例价格仅用于版式验证。真实发布请替换实时查询结果, 并注明平台、时间和价格口径。</div>
    </main>
    </div>
    <script>
      (() => {
        const designWidth = 1080;
        const stage = document.querySelector(".responsive-stage");
        const canvas = document.querySelector(".canvas");
        const fit = () => {
          if (!stage || !canvas) return;
          const scale = Math.min(1, window.innerWidth / designWidth);
          stage.style.width = `${designWidth * scale}px`;
          stage.style.height = `${canvas.scrollHeight * scale}px`;
          canvas.style.transform = `scale(${scale})`;
        };
        window.addEventListener("resize", fit);
        window.addEventListener("load", fit);
        if (document.fonts?.ready) document.fonts.ready.then(fit);
        requestAnimationFrame(fit);
      })();
    </script>
  </body>
</html>
